buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'me.modmuss50:mod-publish-plugin:2.1.1'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

commonJava {
    // Legacy KubeJS is a separate source root so IDEA cannot index it in modern targets.
    srcDir file('../../common/src/kubejsLegacy/java')
    exclude 'com/mafuyu404/smartkeyprompts/network/KeyGuidePayload.java'
    // API evidence: docs/version-differences/SMARTKEYPROMPTS.md.
    exclude 'com/mafuyu404/smartkeyprompts/platform/ComponentItemData.java'
    exclude 'com/mafuyu404/smartkeyprompts/platform/ItemDataAccess.java'
    exclude 'com/mafuyu404/smartkeyprompts/platform/ComponentKeyTexture.java'
    exclude 'com/mafuyu404/smartkeyprompts/util/DataComponentUtils.java'
    exclude 'com/mafuyu404/smartkeyprompts/data/ComponentFunctions.java'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.sighs.cc/repository/maven-releases/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

loom {
    accessWidenerPath = file('src/main/resources/smartkeyprompts.accesswidener')
}


dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"

    modImplementation "cc.sighs.oelib:oelib-fabric-1.20.1:${oel_version}"
    annotationProcessor "cc.sighs.oelib:data-common-1.20.1:${oel_version}"
    modCompileOnly 'mezz.jei:jei-1.20.1-fabric-api:15.20.0.104'
    modLocalRuntime 'mezz.jei:jei-1.20.1-fabric:15.20.0.104'
    modImplementation 'com.terraformersmc:modmenu:7.2.0'
    modCompileOnly 'curse.maven:slashblade-refabricated-1324741:7221187'
    implementation include('org.mvel:mvel2:2.5.0.Final')
    modCompileOnly 'dev.latvian.mods:kubejs-fabric:2001.6.5-build.26'
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version    : fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

apply from: file('../../gradle/target-conventions/publish.gradle')

publishMods {
    curseforge { requires("oelib", "fabric-api") }
    modrinth { requires("oelib", "fabric-api") }
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'OELibRelease'; url = 'https://maven.sighs.cc/repository/maven-releases/' } }
        filter { includeGroup 'cc.sighs.oelib'; includeGroup 'com.flechazo' }
    }
}

// OELib 1.20.1's published processor jar omits its processor service descriptor.
// Select it explicitly while retaining both Mixin annotation processors.
tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.addAll(['-processor',
            'cc.sighs.oelib.data.mvel.processor.ExpressionFunctionProcessor,' +
            'org.spongepowered.tools.obfuscation.MixinObfuscationProcessorInjection,' +
            'org.spongepowered.tools.obfuscation.MixinObfuscationProcessorTargets'])
}

repositories {
    maven { url = 'https://maven.ladysnake.org/releases'; content { includeGroup 'dev.onyxstudios.cardinal-components-api' } }
}
dependencies {
    modCompileOnly 'dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3'
}

repositories {
    // Optional KubeJS API compilation; no scripting mod is added to development runtime.
    exclusiveContent {
        forRepository { maven { name = 'LatvianCompat'; url = 'https://maven.latvian.dev/releases' } }
        filter { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' }
    }
    exclusiveContent {
        forRepository { maven { name = 'ArchitecturyCompat'; url = 'https://maven.architectury.dev/' } }
        filter { includeGroup 'dev.architectury' }
    }
}
